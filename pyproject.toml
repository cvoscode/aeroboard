[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "aeroboard"
version = "0.1.0"
description = "Arrow-Native Real-Time ML Dashboard"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name="Aeroboard Team" }
]
dependencies = [
  "click>=8.1",
  "pillow>=10.0.0",
  "pyarrow>=18.0.0",
  "requests>=2.32.0",
]

[project.urls]
Homepage = "https://github.com/cvoscode/aeroboard"
Repository = "https://github.com/cvoscode/aeroboard"
Issues = "https://github.com/cvoscode/aeroboard/issues"
Releases = "https://github.com/cvoscode/aeroboard/releases"

[project.optional-dependencies]
examples = [
  "lightning>=2.6.0",
  "matplotlib>=3.9.4",
  "torch>=2.8.0",
]
lightning = [
  "lightning>=2.6.0",
]
torch = [
  "torch>=2.8.0",
]
ray = [
    "ray[tune]",
]

[project.scripts]
aeroboard = "aeroboard_client.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["aeroboard-client/src/aeroboard_client"]

[tool.hatch.build.targets.sdist]
include = [
  "/.github/workflows",
  "/BUILDING.md",
  "/README.md",
  "/aeroboard-client/src/aeroboard_client",
  "/setup.sh",
  "/tests",
  "/protocol",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = ["legacy_server: client fixtures using a server without the workspace API"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.uv]
default-groups = ["dev"]
