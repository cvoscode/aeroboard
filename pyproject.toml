[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aeroboard"
version = "0.1.0"
description = "Arrow-Native Real-Time ML Dashboard"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name="Aeroboard Team" }
]
dependencies = [
    "pyarrow",
    "requests",
    "click",
    "pillow",
    "matplotlib>=3.9.4",
    "torch>=2.8.0",
    "lightning>=2.6.0",
]

[project.optional-dependencies]
examples = [
  "matplotlib",
    "torch",
    "lightning",
]
ray = [
    "ray[tune]",
]

[project.scripts]
aeroboard = "aeroboard_client.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["aeroboard-client/src/aeroboard_client"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.uv]
default-groups = ["dev"]
