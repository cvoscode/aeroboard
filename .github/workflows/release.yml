name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: aeroboard-web
        run: npm ci
      - name: Build frontend bundle
        working-directory: aeroboard-web
        run: npm run build
      - name: Package frontend bundle
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME}"
          find aeroboard-web/dist -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' -o -name '*.svg' \) -exec gzip -k -9 {} \;
          tar -czf "aeroboard-web-${VERSION}.tar.gz" -C aeroboard-web dist
      - name: Upload frontend release asset
        uses: softprops/action-gh-release@v2
        with:
          files: aeroboard-web-${{ github.ref_name }}.tar.gz

  build-server:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            slug: linux-x86_64
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            slug: linux-aarch64
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            slug: macos-x86_64
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            slug: macos-aarch64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            slug: windows-x86_64
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build release binary
        working-directory: aeroboard-server
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package release binary (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME}"
          tar -czf "aeroboard-server-${VERSION}-${{ matrix.slug }}.tar.gz" -C "aeroboard-server/target/${{ matrix.target }}/release" aeroboard
      - name: Package release binary (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}"
          Compress-Archive -Path "aeroboard-server/target/${{ matrix.target }}/release/aeroboard.exe" -DestinationPath "aeroboard-server-$version-${{ matrix.slug }}.zip"
      - name: Upload server release asset
        uses: softprops/action-gh-release@v2
        with:
          files: aeroboard-server-${{ github.ref_name }}-${{ matrix.slug }}.${{ matrix.archive }}

  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v4
      - name: Verify tag matches package version
        run: |
          set -e
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              print(tomllib.load(handle)['project']['version'])
          PY
          )
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match pyproject version $PACKAGE_VERSION" >&2
            exit 1
          fi
      - name: Build Python distributions
        run: uv build
      - name: Upload Python release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
  checksums:
    needs: [build-web, build-server, build-python]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts and publish checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets
          cd release-assets
          sha256sum aeroboard-* > SHA256SUMS
          gh release upload "$RELEASE_TAG" SHA256SUMS --clobber
