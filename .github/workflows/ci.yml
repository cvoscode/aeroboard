name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build documentation
        run: python -m sphinx -b dirhtml -W --keep-going docs docs/_build/dirhtml

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v4
      - name: Sync Python environment
        run: uv sync --dev
      - name: Run Python tests
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aeroboard-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aeroboard-server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Lint Rust
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test
