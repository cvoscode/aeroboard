name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build documentation
        run: python -m sphinx -b dirhtml -W --keep-going docs docs/_build/dirhtml

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v4
      - name: Sync Python environment
        run: uv sync --dev
      - name: Run Python tests
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aeroboard-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aeroboard-server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Lint Rust
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --dev
      - run: cargo build --locked --manifest-path aeroboard-server/Cargo.toml
      - name: Start supported Greptime backend
        run: docker run -d --name aeroboard-integration-db -p 127.0.0.1:14000:4000 greptime/greptimedb:v0.12.0 standalone start --http-addr 0.0.0.0:4000
      - name: Wait for Greptime
        run: curl --fail --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:14000/health
      - name: Verify filesystem and Greptime replay
        env:
          AEROBOARD_TEST_BINARY: ${{ github.workspace }}/aeroboard-server/target/debug/aeroboard
          GREPTIME_TEST_URL: http://127.0.0.1:14000
        run: uv run pytest tests/test_workspace_integration.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser checks
        working-directory: aeroboard-web
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Start dashboard fixture
        env:
          AEROBOARD_DATA_DIR: ${{ runner.temp }}/aeroboard-browser
          AEROBOARD_WEB_DIST_DIR: ${{ github.workspace }}/aeroboard-web/dist
        run: |
          aeroboard-server/target/debug/aeroboard > "$RUNNER_TEMP/aeroboard-browser.log" 2>&1 &
          curl --fail --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:3000/api/capabilities
          uv run examples/workspace_example.py
      - name: Verify dashboard workflows
        working-directory: aeroboard-web
        env:
          AEROBOARD_BROWSER_OUTPUT: ${{ runner.temp }}/aeroboard-browser-output
        run: |
          npm run test:browser
          npm run test:browser:runs
          npm run test:browser:groups
          npm run test:browser:analysis
          npm run test:browser:grid
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-browser
          path: ${{ runner.temp }}/aeroboard-browser-output
          if-no-files-found: ignore
      - name: Database diagnostics
        if: failure()
        run: docker logs aeroboard-integration-db
