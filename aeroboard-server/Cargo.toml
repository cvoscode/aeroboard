[package]
name = "aeroboard"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
arrow = "58.0.0"
arrow-flight = "58.0.0"
arrow-ipc = "58.0.0"
axum = { version = "0.8.8", features = ["ws"] }
base64 = "0.22"
fastrand = "2"
futures = "0.3.32"
mime_guess = "2"
reqwest = { version = "0.13.2", features = ["stream", "json", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "net", "signal", "io-util"] }
tokio-stream = "0.1.18"
tonic = "0.14.5"
tower-http = { version = "0.6", features = ["cors", "fs", "compression-gzip", "compression-br"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
urlencoding = "2"
uuid = { version = "1.22.0", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
